name: Publier le tableau de bord
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**','data/**','.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Préparer le site
        run: |
          rm -rf site/data
          mkdir -p site/data
          cp -R data/* site/data/
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
