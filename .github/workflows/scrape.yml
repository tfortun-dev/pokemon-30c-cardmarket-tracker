name: Collecte Cardmarket FR
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths: ['scraper/**','requirements.txt','data/cards.json','.github/workflows/scrape.yml']
permissions:
  contents: write
concurrency:
  group: cardmarket-fr-hourly
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      REQUEST_DELAY_SECONDS: '10'
      NAV_TIMEOUT_MS: '45000'
      MAX_BLOCKS: '3'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Tests
        run: pytest -q
      - name: Collecter
        run: python scraper/main.py
      - name: Enregistrer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/status.json data/history/
          if ! git diff --cached --quiet; then
            git commit -m "data: collecte Cardmarket FR $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
